<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6fb">
  <title>İL-BİS uygulamasını indir</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f4f6fb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 15% 10%, #e2eaff 0, transparent 38%),
        radial-gradient(ellipse at 90% 90%, #e5f5f1 0, transparent 34%),
        #f4f6fb;
    }

    main {
      width: min(100%, 480px);
      padding: 40px;
      border: 1px solid #e5e9f2;
      border-radius: 24px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 24px 70px rgba(28, 43, 75, .1);
    }

    .icon {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin-bottom: 26px;
      border-radius: 18px;
      color: #fff;
      background: linear-gradient(145deg, #536df2, #3548bd);
      box-shadow: 0 10px 22px rgba(70, 92, 220, .25);
      font-size: 27px;
    }

    .eyebrow {
      margin: 0 0 9px;
      color: #596bd2;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 7vw, 36px);
      letter-spacing: -.04em;
      line-height: 1.12;
    }

    .description {
      margin: 14px 0 27px;
      color: #657087;
      font-size: 15px;
      line-height: 1.65;
    }

    .file {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 22px;
      padding: 14px;
      border: 1px solid #e9edf4;
      border-radius: 14px;
      background: #fafbfe;
    }

    .file-mark {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 12px;
      color: #495ed0;
      background: #edf0ff;
      font-size: 12px;
      font-weight: 800;
    }

    .file-name { overflow-wrap: anywhere; font-size: 14px; font-weight: 700; }
    .file-size { margin-top: 4px; color: #7d879a; font-size: 12px; }

    .download {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: 14px;
      color: #fff;
      background: #465bd1;
      box-shadow: 0 8px 18px rgba(70, 91, 209, .22);
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      transition: background .15s ease, transform .15s ease;
    }

    .download:hover { background: #394dbd; transform: translateY(-1px); }
    .download:focus-visible { outline: 3px solid #aab5ff; outline-offset: 3px; }

    .note {
      margin: 18px 0 0;
      color: #7d879a;
      font-size: 12px;
      line-height: 1.55;
      text-align: center;
    }

    @media (max-width: 520px) {
      main { padding: 30px 24px; border-radius: 20px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">↓</div>
    <p class="eyebrow">Uygulama indirme sayfası</p>
    <h1>İL-BİS’i indirin</h1>
    <p class="description">Uygulamayı iPhone veya iPad’inize yüklemek için aşağıdaki düğmeye dokunun.</p>

    <section class="file" aria-label="Dosya bilgisi">
      <div class="file-mark" aria-hidden="true">IPA</div>
      <div>
        <div class="file-name">İL-BİS.ipa</div>
        <div class="file-size">iOS uygulaması · 9,4 MB</div>
      </div>
    </section>

    <a class="download" id="install" href="#">
      <span aria-hidden="true">↓</span>
      iPhone’a yükle
    </a>
    <p class="note" id="install-note">Kurulum için sayfanın HTTPS üzerinden yayınlanması ve cihazınızın dağıtım profiline kayıtlı olması gerekir.</p>
  </main>
  <script>
    const installLink = document.getElementById("install");
    const installNote = document.getElementById("install-note");
    if (window.location.protocol === "https:") {
      const manifestUrl = new URL("manifest.plist", window.location.href).href;
      installLink.href = `itms-services://?action=download-manifest&url=${encodeURIComponent(manifestUrl)}`;
    } else {
      installLink.setAttribute("aria-disabled", "true");
      installLink.addEventListener("click", (event) => event.preventDefault());
      installNote.textContent = "Kurulumu başlatmak için bu sayfayı HTTPS kullanan bir web sunucusunda açın.";
      installLink.style.opacity = ".55";
      installLink.style.cursor = "not-allowed";
    }
  </script>
</body>
</html>
